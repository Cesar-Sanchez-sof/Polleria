# Servicio de IA del Asistente Financiero (SPEC-023).
#
# B1 funciona exclusivamente con la biblioteca estándar de Python.
# B2–B4 y la capa HTTP (T026–T029) usan dependencias instaladas SOLO en ai-service/.venv.
#
# Versiones instaladas y verificadas (2026-10-12), para reproducibilidad:
#   sqlglot 30.22.0 · pydantic 2.14.1 (pydantic-core 2.50.1) · pytest 9.1.1
#   fastapi 0.143.0 (starlette 1.7.0, anyio 4.15.1) · httpx 0.28.1 · uvicorn 0.54.0
# Mantener pydantic-core 2.50.1: Smart App Control ya evaluó ese binario nativo sin firma.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
description = "Orquestación del Asistente Financiero con IA del ERP (SPEC-023)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "sqlglot",
]

[project.optional-dependencies]
# Pruebas: httpx lo usa el TestClient de Starlette (transporte en proceso, sin red)
dev = ["pytest", "httpx"]
# Solo para levantar el servidor local de desarrollo (sin extras compilados)
server = ["uvicorn"]
# PostgresReadOnlyExecutor (AI_SQL_EXECUTOR=postgres_readonly): importación diferida; aún NO
# instalado en Windows (requiere autorización y verificar Smart App Control con su libpq).
postgres = ["psycopg>=3"]
# RAG semántico (T033): multilingual-e5-small con ONNX Runtime en CPU (sin PyTorch: Smart App Control
# bloquea torch_python.dll en Windows) y cliente de Milvus/Zilliz. Instalados y verificados: onnxruntime
# 1.31.0, tokenizers 0.23.3, huggingface_hub 1.33.0, numpy 2.4.6, pymilvus 3.0.2 (grpcio 1.84.0).
vector = ["onnxruntime", "tokenizers", "huggingface_hub", "numpy", "pymilvus"]
# Servicio de inferencia XiYanSQL (inference_server/): SOLO en el entorno de WSL, nunca en Windows.
# Versiones de requirements-lock.txt del proyecto de entrenamiento: torch 2.13.0+cu132,
# transformers 5.17.0, peft 0.21.0, bitsandbytes 0.50.2, accelerate 1.15.0.
# fastapi y uvicorn aún NO están instalados allí (pendiente de autorización, T057).
inference = ["fastapi", "uvicorn", "pydantic>=2", "torch", "transformers", "peft", "bitsandbytes", "accelerate"]

[tool.setuptools.packages.find]
where = ["src"]
