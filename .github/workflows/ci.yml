name: CI Integración Continua

on:
  push:
    branches: [ "feature/gestion-mesas", "main", "master" ]
  pull_request:
    branches: [ "feature/gestion-mesas", "main", "master" ]

jobs:
  verificar_y_construir:
    name: Pruebas Unitarias y Build Next.js
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: "comprobantes"
      JSON_PE_TOKEN: ${{ secrets.JSON_PE_TOKEN }}
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
      MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
      MERCADO_PAGO_PUBLIC_KEY: ${{ secrets.MERCADO_PAGO_PUBLIC_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar Dependencias del Proyecto
        run: npm ci || npm install

      - name: Generar Tipos de Prisma Client
        run: npx prisma generate

      - name: Ejecutar Suite de Pruebas Unitarias (Vitest)
        run: npx vitest run

      - name: Compilar y Verificar Build de Producción Next.js
        run: npm run build
